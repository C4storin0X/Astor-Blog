media:
  input: media
  output: /media

content:
  - name: articles
    label: Articoli
    type: collection
    path: content/articles
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, category, status, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
      - name: description
        label: Descrizione breve
        type: text
      - name: category
        label: Categoria
        type: select
        options:
          values: [SOC, DFIR, OSINT, Threat Intelligence, Malware Analysis, Network Security, Web Security, OT-ICS, Tutorial, Altro]
      - name: date
        label: Data
        type: date
      - name: status
        label: Stato
        type: select
        options:
          values: [Draft, Published]
      - name: cover
        label: Immagine di copertina
        type: image
      - name: body
        label: Contenuto
        type: rich-text

  - name: tools
    label: Cyber Tools
    type: collection
    path: content/tools
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, category, access]
      primary: title
      sort: [title]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Nome del tool
        type: string
        required: true
      - name: url
        label: URL ufficiale
        type: string
        required: true
      - name: category
        label: Categoria
        type: select
        options:
          values: [OSINT, Threat Intelligence, IP-Domain-DNS, Email Analysis, Malware Analysis, Web Security, Network Analysis, DFIR, OT-ICS, Utilities, Altro]
      - name: description
        label: Descrizione
        type: text
      - name: access
        label: Modalita di accesso
        type: select
        options:
          values: [Web, CLI, Desktop, API, Altro]
      - name: pricing
        label: Licenza o costo
        type: select
        options:
          values: [Free, Freemium, Paid, Open Source, Non verificato]
      - name: favorite
        label: Preferito
        type: boolean
      - name: body
        label: Note e casi d'uso
        type: rich-text
